<div class="app">

  <div id="backdropHost"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div id="brandHost"></div>

    <div class="sidebar-scroll">
      <div id="homeHost"></div>
      <div id="newGardenHost"></div>

      <p class="label-small">Garden</p>
      <div class="panel-block">
        <div id="dimensionsHost"></div>
        <div id="uploadPlotHost"></div>
        <p class="plot-note" id="calibReadout">No plot photo loaded.</p>
      </div>

      <div id="bedActionsHost"></div>
      <div id="groundAreaHost"></div>
      <div id="plantingActionsHost"></div>

      <p class="label-small">Tools</p>
      <div id="organizerToolHost"></div>

      <p class="label-small">Planting areas</p>
      <div class="panel-block" id="bedList"></div>

      <p class="label-small">Obstacles</p>
      <div class="panel-block" id="obstacleList"></div>

      <p class="label-small">Legend</p>
      <div id="legendHost"></div>

      <div id="helpHost"></div>
    </div>
  </aside>

  <!-- ── Canvas ── -->
  <div class="main">
    <div id="toolbarHost"></div>
    <div class="canvas-area">
      <canvas id="gardenCanvas"></canvas>
    </div>
  </div>

  <!-- ── Right Panel ── -->
  <div class="right-panel" id="rightPanel">
    <div class="panel-header">
      <h2 id="panelTitle">Details</h2>
      <div id="closePanelHost"></div>
    </div>
    <div id="panelActionsHost"></div>
    <div id="organizerHost"></div>

    <div class="panel-section">
      <h3>Properties</h3>
      <div id="nameHost"></div>
      <div id="sizeHost"></div>
      <div id="polySection" style="display:none">
        <p class="plot-note" id="polyStats"></p>
        <p class="plot-note" id="neighborNote" style="display:none;color:#92400e"></p>
      </div>
      <div id="propertiesHost"></div>
    </div>

    <div id="plantsHost"></div>

    <div id="notesHost"></div>

    <div id="tipHost"></div>
  </div>

</div>
